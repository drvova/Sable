[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sable-prover"
version = "1.0.0"
description = "Sable: a GPU prover and verifier for bit-exact LLM inference"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomer Solberg", email = "research@moonmath.ai" }]
requires-python = ">=3.12"
# CuPy is installed for one CUDA major version; cupy-cuda13x matches the CUDA 13 build of PyTorch
# used for the paper (requirements.txt pins the exact environment).
dependencies = [
    "torch>=2.14.1",
    "cupy-cuda13x>=14.2.0",
    "numpy>=2.5.4",
    "blake3>=1.0.11",
    "mpmath>=1.3.0",
    "ninja>=1.13.2",
]

[project.optional-dependencies]
# the scripts that quantize the checkpoint and measure accuracy / serving (scripts/)
eval = [
    "transformers>=5.19.0",
    "datasets>=5.1.0",
    "safetensors>=0.8.0",
    "huggingface_hub>=2.2.0",
    "triton>=3.8.0",
]
dev = ["pytest>=9.2.0", "ruff>=0.17.3"]

[project.urls]
Repository = "https://github.com/moonmath-ai/Sable"

[tool.setuptools.packages.find]
include = ["zk", "zk.*"]

[tool.setuptools.package-data]
zk = ["cuda/*.cu", "cuda/*.cuh", "cuda/*.h", "cuda/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
# pyflakes and the pycodestyle errors; the code base's own layout conventions are kept
select = ["F", "E9", "E7"]
ignore = ["E702", "E731", "E741"]
